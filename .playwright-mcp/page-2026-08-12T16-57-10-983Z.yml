            - paragraph [ref=f6e118]: Creating the venv doesn't turn it on — we still have to activate it in this terminal session so python/pip point inside venv/ instead of the system install.
            - generic [ref=f6e119]: New in this step
            - generic [ref=f6e120]:
              - generic [ref=f6e121]:
                - term [ref=f6e122]: Activate
                - definition [ref=f6e123]: switches your current terminal to use the virtual environment's private Python instead of the computer's main one.
              - generic [ref=f6e124]:
                - term [ref=f6e125]: source (macOS/Linux)
                - definition [ref=f6e126]: runs a script's commands directly inside your current terminal, rather than starting it as a separate process. That's needed here, since activation only works if it changes this terminal's own settings.
            - generic [ref=f6e127]: Why it matters
            - paragraph [ref=f6e128]: Activation temporarily rewrites PATH for this terminal window only, so pip install in Step 5 lands inside venv/ instead of globally. You'll see (venv) appear at the start of the prompt when it worked.
            - generic [ref=f6e129]: Common problems
            - list [ref=f6e130]:
              - listitem [ref=f6e131]: "PowerShell error: \"cannot be loaded because running scripts is disabled on this system\" — PowerShell's execution policy is blocking the activation script. Fix (run once, in an admin PowerShell): Set-ExecutionPolicy -Scope CurrentUser RemoteSigned."
              - listitem [ref=f6e132]: Opening a new terminal tab/window later in the semester and forgetting to reactivate — if (venv) isn't showing, packages will silently install globally again.
              - listitem [ref=f6e133]: VS Code's integrated terminal or "Run" button using a different Python interpreter than the one you activated manually — see Step 4.

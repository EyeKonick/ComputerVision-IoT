                - definition [ref=f31e143]: a command that asks Python to tell you which version of itself is installed.
              - generic [ref=f31e144]:
                - term [ref=f31e145]: PATH
                - definition [ref=f31e146]: a list your computer checks to find a program when you type its name in the terminal. If a program "isn't on PATH," the terminal doesn't know where to find it.
              - generic [ref=f31e147]:
                - term [ref=f31e148]: py
                - definition [ref=f31e149]: an alternative launcher command Windows installs alongside Python; useful when plain python doesn't work.
            - generic [ref=f31e150]: Why it matters
            - paragraph [ref=f31e151]: "mediapipe's published wheels typically trail the newest Python release by a few months. If `python --version` reports something very new (e.g. a version released in the last month or two), `pip install mediapipe` in Step 5 may fail with no matching distribution — better to catch that now than mid-install."

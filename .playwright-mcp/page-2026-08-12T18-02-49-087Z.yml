            - generic [ref=f29e118]: Setup & Environment — Step 6 of 7 (two paths, one step)
            - 'heading "Set up your camera source: laptop webcam or phone over USB" [level=2] [ref=f29e119]'
            - paragraph [ref=f29e120]: Everyone's camera situation today is one of two paths. If you're on your own laptop with a built-in camera, you're already done — skip to Step 7. If you're on a lab PC, there's no webcam, and this room has no WiFi, so your phone becomes the camera, connected by USB cable only.
            - generic [ref=f29e121]: New in this step
            - generic [ref=f29e122]:
              - generic [ref=f29e123]:
                - term [ref=f29e124]: adb (Android Debug Bridge)
                - definition [ref=f29e125]: Google's official tool that lets a computer talk to an Android phone over a USB cable.
              - generic [ref=f29e126]:
                - term [ref=f29e127]: adb reverse
                - definition [ref=f29e128]: a specific adb command that makes something running on the phone reachable from the computer, through that same USB cable.
              - generic [ref=f29e129]:
                - term [ref=f29e130]: USB debugging
                - definition [ref=f29e131]: an Android setting that allows tools like adb to actually communicate with the phone; it's off by default for security, which is why it needs turning on.
              - generic [ref=f29e132]:
                - term [ref=f29e133]: localhost
                - definition [ref=f29e134]: a special address meaning "this same computer." It's used here because the phone's video stream gets tunneled through USB to look like it's coming from the PC itself.
            - generic [ref=f29e135]: Why it matters
            - paragraph [ref=f29e136]: adb reverse is official Android developer tooling — it's the reverse direction of port forwarding (device → host instead of host → device), so a server the phone is already running on itself becomes reachable on the PC. This avoids installing a third-party virtual-camera driver on every lab PC — school antivirus/locked-down images are far more likely to block or quarantine those than a plain, Google-signed adb.exe. Both real activities read whichever source you set through one shared CAM_SOURCE value, so nothing else in the code changes between Path A and Path B.
            - generic [ref=f29e137]: Common problems
            - list [ref=f29e138]:
              - listitem [ref=f29e139]: Phone not detected by adb at all — install the OEM USB driver for your phone brand (Samsung, Pixel, etc.); needed once per phone model.
              - listitem [ref=f29e140]: adb reverse "command not found" — Android Platform Tools isn't installed/on PATH on this PC; the instructor installs this once per lab machine ahead of time, not per student.
              - listitem [ref=f29e141]: Stream drops mid-class — the phone's screen locked or IP Webcam got backgrounded; re-open the app and tap Start server again, and double-check "Keep screen on."
              - listitem [ref=f29e142]: Different PC than last time — the "Allow USB debugging?" prompt reappears, since authorization is per phone-PC pairing, not global to the phone. Tap Allow again.
              - listitem [ref=f29e143]: "Documented fallback if IP Webcam / adb reverse won't cooperate on a given phone: try DroidCam (USB mode, free, official Windows client, bundles its own adb) — install the Windows client, connect via USB in the client, then use its assigned device index the same way as Path A."

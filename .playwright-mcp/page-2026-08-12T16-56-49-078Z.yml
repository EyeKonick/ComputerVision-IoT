          - heading "Closing framing note — say this before wrap-up" [level=3] [ref=f5e145]
          - paragraph [ref=f5e146]: "The orb you just built is standing in for something bigger. Your syllabus calls this module's theme \"touchless actuation as an IoT action\" — in a real IoT system, that pinch-and-drag wouldn't move a picture on your own screen, it would trigger something in the physical world: turning on a smart light, moving a servo, sending an HTTP request to a device on the network. We didn't build that connection today — this is a deliberately simple stand-in so we could focus on the computer-vision side: detecting the hand, recognizing the gesture, and turning it into some kind of action. Swapping the orb-drawing code for a real network call or hardware signal is a natural next step, not something built into this activity."

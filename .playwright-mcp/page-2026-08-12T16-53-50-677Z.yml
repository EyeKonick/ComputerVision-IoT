            - heading "Draw the orb" [level=2] [ref=f3e117]
            - paragraph [ref=f3e118]: Time to actually see it — a glowing orb sitting in the middle of the screen, waiting to be grabbed.
            - generic [ref=f3e119]: New in this step
            - generic [ref=f3e120]:
              - generic [ref=f3e121]:
                - term [ref=f3e122]: tuple(orb_pos)
                - definition [ref=f3e123]: converts a list into a tuple, here just for this one function call, since glow_circle expects a tuple-style point.
              - generic [ref=f3e124]:
                - term [ref=f3e125]: X if condition else Y (a conditional expression)
                - definition [ref=f3e126]: picks between two values on a single line, depending on whether condition is true.
              - generic [ref=f3e127]:
                - term [ref=f3e128]: math.sin(...)
                - definition [ref=f3e129]: a math function that smoothly rises and falls between -1 and 1, forever, like a gentle wave — used here to make the orb pulse.
            - generic [ref=f3e130]: Why it matters
            - paragraph [ref=f3e131]: glow_circle needs a tuple for its center argument (matching how it's used everywhere else in the file), so tuple(orb_pos) converts the mutable list back for just this call without changing what orb_pos actually is. When idle, pulse = int(6 * math.sin(time.time() * 4)) makes the orb's radius gently oscillate — math.sin cycles smoothly between -1 and 1 forever, time.time() * 4 speeds up how fast it cycles, and * 6 sets how many pixels it swells and shrinks by; the if not orb_held else 0 turns the pulse off while held, so a grabbed orb stays a steady, predictable size instead of pulsing under your finger. The orb_color swap (brighter ORB_GLOW_COLOR while held) gives an extra visual cue that the grab registered, on top of the orb actually following your finger.
            - generic [ref=f3e132]: Common problems
            - list [ref=f3e133]:
              - listitem [ref=f3e134]: Orb position feels laggy or jittery — this tracks directly to camera FPS (which Step 4 finally makes visible), since the orb only updates once per processed frame; a slow phone-stream connection (Path B) will visibly lag more than a local laptop webcam.
              - listitem [ref=f3e135]: Students may ask why the orb doesn't pulse while held — that's intentional (see above), not a missing feature; worth stating outright so it isn't reported as a bug.

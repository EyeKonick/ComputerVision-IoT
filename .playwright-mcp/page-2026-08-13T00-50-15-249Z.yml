              - generic [ref=f9e144]:
                - term [ref=f9e145]: PATH
                - definition [ref=f9e146]: a list your computer checks to find a program when you type its name in the terminal. If a program "isn't on PATH," the terminal doesn't know where to find it.
              - generic [ref=f9e147]:
                - term [ref=f9e148]: py

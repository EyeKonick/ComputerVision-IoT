            - generic [ref=f1e144]:
              - term [ref=f1e145]: PATH
              - definition [ref=f1e146]: a list your computer checks to find a program when you type its name in the terminal. If a program "isn't on PATH," the terminal doesn't know where to find it.
            - generic [ref=f1e147]:
              - term [ref=f1e148]: py

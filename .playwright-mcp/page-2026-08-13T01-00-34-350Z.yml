        - generic [ref=f13e143]:
          - heading "Session goal — say this out loud at the start" [level=3] [ref=f13e144]
          - paragraph [ref=f13e145]: By the end of today, everyone has Python, an isolated project environment, and both activities' libraries installed — and we've proven the camera works from Python before we build anything real on top of it.
          - list [ref=f13e146]:
            - listitem [ref=f13e147]: "`source code/hand-tracking/requirements.txt` now also pins `mediapipe==0.10.14`, matching `source code/facial-recognition/requirements.txt`. Step 6 keeps the discussion of why pinning matters, since it's a useful, real example for students, but there's no longer a live mismatch in the repo."
            - listitem [ref=f13e148]: "Two-path classroom note: Lab PCs have no built-in webcam and the room has no WiFi (Ethernet only). Students on lab PCs use their Android phone over USB as the camera instead; students with their own laptop keep using its built-in webcam. Step 7 below covers both. Both `hand_ar.py` and `face_tracker.py` read a single `CAM_SOURCE` config value (an int device index, or a URL string) instead of a hardcoded camera index, so the same script works either way."
            - listitem [ref=f13e149]: "Step 2 (below) is a genuine conditional branch, not just a hardware fork like the camera step: most students already have Python, so Path A is a no-op \"you're set, continue.\" Path B is only for the rare student who needs to install it from scratch, and merges straight back into Step 3 once done — don't spend class time walking everyone through Path B if only one or two students need it."

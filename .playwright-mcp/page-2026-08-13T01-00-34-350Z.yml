                - term [ref=f13e158]: python --version
                - definition [ref=f13e159]: a command that asks Python to tell you which version of itself is installed.
              - generic [ref=f13e160]:
                - term [ref=f13e161]: PATH
                - definition [ref=f13e162]: a list your computer checks to find a program when you type its name in the terminal. If a program "isn't on PATH," the terminal doesn't know where to find it.
              - generic [ref=f13e163]:
                - term [ref=f13e164]: py
                - definition [ref=f13e165]: an alternative launcher command Windows installs alongside Python; useful when plain python doesn't work.
            - generic [ref=f13e166]: Why it matters
            - paragraph [ref=f13e167]: "mediapipe's published wheels typically trail the newest Python release by a few months. If `python --version` reports something very new (e.g. a version released in the last month or two), `pip install mediapipe` in Step 6 may fail with no matching distribution — better to catch that now than mid-install."
